name: Birthday 

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:

jobs:
  check-birthday:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update README Conditionally
        run: |
          BIRTHDAY="03-28"
          CURRENT_DATE=$(date -u +%m-%d)

          if [ "$CURRENT_DATE" == "$BIRTHDAY" ]; then
            echo "🎉 Happy Birthday to phuocthanhlamnguyen-gif! 🎂" > README.md
            echo "Hope you have an amazing day!" >> README.md
          else
            if [ -f "README.normal.md" ]; then
              cp README.normal.md README.md
            fi
          fi

      - name: Commit and Push if Changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatic birthday README toggle"
          file_pattern: README.md
